name: unpack archive thumbnails

on:
  push:
    branches: [main]
    paths:
      - '.archive-bulk/archive-thumbnails.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand archive thumbnail bundle
        shell: bash
        run: |
          if [ ! -f .archive-bulk/archive-thumbnails.zip ]; then
            echo "Bundle already expanded."
            exit 0
          fi
          mkdir -p assets/archive-thumbnails
          unzip -o -q .archive-bulk/archive-thumbnails.zip -d assets/archive-thumbnails
          git rm .archive-bulk/archive-thumbnails.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/archive-thumbnails
          git commit -m "expand artwork archive thumbnails"
          git push
